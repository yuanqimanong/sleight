# 日常 CI。发布工作流只在打 tag 时跑，所以测试要靠这个 —— 发布前才发现挂了很难受。
#
# test 矩阵跑单测（假 transport，不开浏览器）；browser job 单独跑**真浏览器**集成测试
# （iframe/OOPIF/Shadow/Snapshot/Ref/Gateway/MCP 这些只有真页面能证明的东西）。
# 需要真 CloakBrowser Manager 的那批仍会 skip —— 那要商业组件，CI 上没有。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支上新的 push 直接取消上一次还在跑的，别排队浪费额度
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Windows 单独带一组：路径分隔符、临时目录权限、socket 超时行为都和
          # Linux 不一样，而这个库的主力开发环境就是 Windows
          - python: "3.13"
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv 从 v8 起不再发布裸 major 标签（只有 vX.Y.Z），
      # 写 @v9 会 Unable to resolve action —— 必须钉完整版本号
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --extra dev

      - name: pytest
        run: uv run pytest -q

  browser:
    name: 真浏览器集成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv 从 v8 起不再发布裸 major 标签（只有 vX.Y.Z），
      # 写 @v9 会 Unable to resolve action —— 必须钉完整版本号
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --extra dev

      # runner 镜像自带 Google Chrome；找不到就**让 job 红**，而不是让集成测试
      # 静默 skip 出一个绿勾 —— "跑了 0 条真浏览器测试的绿 CI"正是我们要消灭的东西
      - name: 定位浏览器
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER" || { echo "no browser on this runner"; exit 1; }
          echo "SLEIGHT_TEST_CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version

      # 收集数为 0 同样判红：marker 写错、文件改名都会让它悄悄变成空跑
      - name: 确认有集成用例可跑
        run: |
          N="$(uv run pytest -m integration --collect-only -q 2>/dev/null | grep -c '::' || true)"
          echo "collected $N integration tests"
          test "$N" -gt 0 || { echo "no integration tests collected"; exit 1; }

      - name: 真浏览器测试
        run: uv run pytest -m integration -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv 从 v8 起不再发布裸 major 标签（只有 vX.Y.Z），
      # 写 @v9 会 Unable to resolve action —— 必须钉完整版本号
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --extra dev
      - run: uv run ruff check .
      # 不跑 ruff format --check：这个项目的注释是手工按列对齐的，
      # formatter 会把它们全压掉。lint 规则在 pyproject 里，够了

  package:
    name: 打包可用性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv 从 v8 起不再发布裸 major 标签（只有 vX.Y.Z），
      # 写 @v9 会 Unable to resolve action —— 必须钉完整版本号
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: 构建
        run: uv build

      - name: 元数据校验
        run: uv tool run --from twine twine check dist/*

      # 装到一个干净环境里冒烟 —— 光能构建不代表装完能 import
      - name: 干净环境冒烟
        run: |
          uv venv /tmp/probe
          uv pip install --python /tmp/probe/bin/python dist/*.whl
          cd /tmp
          /tmp/probe/bin/python -c "
          import sleight
          from sleight import connect, launch, Pool, Session, NetworkResource, FAST
          from sleight import Snapshot, BackendElement, StaticElement, ExtractedDocument, StaleRef
          from sleight.providers import CloakBrowserManager, ProfileSpec, Plain, LocalLauncher, Region
          from sleight.agent import Gateway, MCPServer
          from sleight.lease import MemoryLease
          from sleight.core.human import mouse_path, DEFAULT
          from sleight.core.types import Box, Point
          from sleight.core.static import parse_html
          from random import Random
          assert mouse_path(Point(0, 0), Box(400, 300, 120, 40), rng=Random(1), profile=DEFAULT)
          assert ProfileSpec.windows('x', Region.HK).timezone == 'Asia/Hong_Kong'
          assert parse_html('<p id=a>hi</p>').query('#a').text == 'hi'
          print('smoke ok', sleight.__version__)
          "

      # 部署层：console script 装上了没有、界面的 index.html 有没有被打进 wheel、
      # 以及在**没装 fastapi**的环境里 sleight ui 会不会给一句人话
      - name: 部署 CLI 冒烟
        run: |
          cd /tmp
          /tmp/probe/bin/sleight --version
          /tmp/probe/bin/sleight hosts ls
          /tmp/probe/bin/python -c "
          from pathlib import Path
          import sleight.deploy.api.app as api
          from sleight.deploy import DeploySpec, Deployer, LocalRunner
          from sleight.deploy.render import render_compose
          assert 'AUTH_TOKEN:?' in render_compose(DeploySpec())
          assert Path(api.INDEX).is_file(), 'index.html missing from the wheel'
          print('deploy smoke ok')
          "
          # 探针环境没装 [ui]，所以这里不会真的起服务；要的是那句人话而不是 traceback
          /tmp/probe/bin/sleight ui 2>&1 | grep -q 'sleight\[ui\]'
          # MCP server 的 console script 装上了没有。没给浏览器时它该给一句人话就退出，
          # 不是 traceback —— MCP host 里配错了环境变量就是这个场景
          /tmp/probe/bin/sleight-mcp 2>&1 </dev/null | grep -q 'SLEIGHT_CDP_URL'
