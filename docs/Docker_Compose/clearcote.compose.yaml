# 归档参数模板：镜像身份来自历史记录；资源项为后整理的统一示例，不是逐轮配置复刻。
# clearcote / Chromium 150.0.7871.114
# 来源：历史实际配置；image ID: sha256:7f0207b0d0f4187cd13c2219281978ceff16ca1a9acbcf4a0d5a024531bdf2e7
# 上游：https://github.com/clearcotelabs/clearcote-browser
# 驱动：chromium；下方为仅保留镜像身份的空闲容器模板。
# 本地自建镜像及构建源码已按要求删除。需先取得镜像或通过 BROWSER_IMAGE 指定替代镜像。
# 此文件只保留容器配置；不包含或启动历史测试任务。不能单凭此文件重建原环境。
name: sleight-record-clearcote
services:
  browser:
    image: "${BROWSER_IMAGE:-sleight-eval-clearcote:20261011}"
    pull_policy: never
    command: ["sleep", "infinity"]
    environment:
      DISPLAY: ":99"
      TZ: UTC
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 1g
    pids_limit: 2048
    restart: "no"
    labels:
      sleight.project: browser-kernel-research
