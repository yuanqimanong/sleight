# 归档参数模板：仅记录共用镜像；4CPU/4GiB为整理模板值，不证明每轮实际资源限额。
# calypso 补测时候选与stock共用镜像配置记录
# 浏览器版本：157.0
# 候选执行文件：/opt/calypso-native/calypso
# stock执行文件：/opt/r3-stock/firefox/firefox
# 镜像ID：sha256:0bad2a56f8a113a0d917819612edd34a506b852b7d1446f5af018d9cfc2ab74e
# 镜像和所有补测文件已删除；需自行恢复镜像。本文件不执行测试。
name: sleight-record-round3-calypso
services:
  browser:
    image: "${BROWSER_IMAGE:-sleight-r3-pair-calypso:20261024}"
    pull_policy: never
    command: ["sleep", "infinity"]
    environment:
      DISPLAY: ":99"
      TZ: UTC
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 1g
    pids_limit: 2048
    restart: "no"
