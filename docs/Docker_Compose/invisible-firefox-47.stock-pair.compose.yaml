# 归档参数模板：仅记录共用镜像；4CPU/4GiB为整理模板值，不证明每轮实际资源限额。
# invisible-firefox-47 补测时候选与stock共用镜像配置记录
# 浏览器版本：151.0
# 候选执行文件：/opt/browser/firefox
# stock执行文件：/opt/r3-stock/firefox/firefox
# 镜像ID：sha256:9d1aa6ca8c96bf88f50c697a0e3710ec479d6e9348350ae650fad96884a77bd6
# 镜像和所有补测文件已删除；需自行恢复镜像。本文件不执行测试。
name: sleight-record-round3-invisible-firefox-47
services:
  browser:
    image: "${BROWSER_IMAGE:-sleight-r3-pair-invisible-firefox-47:20261024}"
    pull_policy: never
    command: ["sleep", "infinity"]
    environment:
      DISPLAY: ":99"
      TZ: UTC
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 1g
    pids_limit: 2048
    restart: "no"
