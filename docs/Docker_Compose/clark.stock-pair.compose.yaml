# 归档参数模板：仅记录共用镜像；4CPU/4GiB为整理模板值，不证明每轮实际资源限额。
# clark 补测时候选与stock共用镜像配置记录
# 浏览器版本：148.0.7778.96
# 候选执行文件：/opt/selected-browser/chrome
# stock执行文件：/opt/r3-stock/chrome-linux64/chrome
# 镜像ID：sha256:7f4a461188e8cafdaa364b68f0ef5064db331e6f6b6e5e9bfb1b2be955dc6fbc
# 镜像和所有补测文件已删除；需自行恢复镜像。本文件不执行测试。
name: sleight-record-round3-clark
services:
  browser:
    image: "${BROWSER_IMAGE:-sleight-r3-pair-clark:20261024}"
    pull_policy: never
    command: ["sleep", "infinity"]
    environment:
      DISPLAY: ":99"
      TZ: UTC
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 1g
    pids_limit: 2048
    restart: "no"
