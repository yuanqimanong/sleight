<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sleight deploy</title>
<style>
/* ========================================================================== *
 * 设计变量。浅色是默认，深色靠 :root[data-theme="dark"] 覆盖；
 * data-theme="auto" 时交给 prefers-color-scheme。
 * ========================================================================== */
:root {
  --bg:#f6f7f9;  --panel:#fff;     --panel-2:#fafbfc; --line:#e3e7ed;
  --fg:#1b2330;  --dim:#657085;    --faint:#8d97a8;
  --acc:#2563eb; --acc-fg:#fff;    --acc-soft:#e8f0fe;
  --ok:#0f7a4d;  --ok-soft:#e6f5ee;
  --warn:#8a5a00;--warn-soft:#fdf3e0;
  --bad:#c02a20; --bad-soft:#fdeceb;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme="dark"] {
  --bg:#0e131a;  --panel:#151c25;  --panel-2:#1a222d; --line:#26303d;
  --fg:#e2e8f0;  --dim:#94a3b8;    --faint:#6b7a8d;
  --acc:#60a5fa; --acc-fg:#0b1220; --acc-soft:#17263c;
  --ok:#4ade80;  --ok-soft:#12251c;
  --warn:#fbbf24;--warn-soft:#2a2113;
  --bad:#f87171; --bad-soft:#2c1717;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg:#0e131a;  --panel:#151c25;  --panel-2:#1a222d; --line:#26303d;
    --fg:#e2e8f0;  --dim:#94a3b8;    --faint:#6b7a8d;
    --acc:#60a5fa; --acc-fg:#0b1220; --acc-soft:#17263c;
    --ok:#4ade80;  --ok-soft:#12251c;
    --warn:#fbbf24;--warn-soft:#2a2113;
    --bad:#f87171; --bad-soft:#2c1717;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}
h1,h2,h3{margin:0;font-weight:600}
pre{margin:0}

header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header h1{font-size:15px}
header .ver{color:var(--faint);font:12px var(--mono)}
.spacer{flex:1}
main{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
@media(max-width:920px){main{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);min-height:calc(100vh - 53px);padding:16px 14px;
  background:var(--panel)}
section.body{padding:20px 24px 60px;min-width:0}

.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:10px}
.muted{color:var(--dim)}
.tiny{font-size:12.5px;line-height:1.55}
.mono{font-family:var(--mono);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:14.5px;margin-bottom:4px}
.card > .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px;line-height:1.6}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--fg);padding:7px 13px;transition:.12s}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
button.danger.primary{background:var(--bad);border-color:var(--bad);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--dim);padding:5px 9px}
button.ghost:hover{background:var(--bg);color:var(--fg)}
button.sm{padding:4px 10px;font-size:12.5px}

.field{margin-bottom:15px}
.field > label{display:block;font-weight:600;font-size:13px;margin-bottom:3px}
.field .why{color:var(--dim);font-size:12.5px;line-height:1.5;margin-bottom:6px}
.field .rec{color:var(--ok);font-size:12.5px;margin-top:5px}
.field .rec::before{content:"推荐 ";color:var(--faint)}
input[type=text],input[type=number],select{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--fg);font:13px var(--mono)}
input:focus,select:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:auto;flex:none}

.hostgroup{margin-bottom:18px}
.hostgroup > .name{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;
  padding:0 6px 6px;flex-wrap:wrap}
.target{display:block;width:100%;text-align:left;padding:9px 11px;margin-bottom:5px;
  border:1px solid transparent;border-radius:9px;background:transparent}
.target:hover{background:var(--bg)}
.target[aria-current="true"]{background:var(--acc-soft);border-color:var(--acc)}
.target b{display:block;font-size:13px}
.target .meta{display:block;color:var(--dim);font:11.5px var(--mono);margin-top:2px}

.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11.5px;font-weight:600;border:1px solid transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.idle{background:var(--bg);color:var(--dim);border-color:var(--line)}

nav.tabs{display:flex;gap:3px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav.tabs button{border:0;border-radius:0;background:transparent;color:var(--dim);padding:9px 14px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
nav.tabs button:hover{color:var(--fg)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}

.steps{display:flex;margin-bottom:22px;flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:9px;padding:0 18px 0 0;color:var(--faint)}
.steps .s .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);font-size:12px;font-weight:600;flex:none}
.steps .s[data-on="true"]{color:var(--fg)}
.steps .s[data-on="true"] .n{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.steps .s[data-done="true"] .n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pick button{text-align:left;padding:14px;border-radius:var(--r);height:100%}
.pick button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.pick b{display:block;font-size:13.5px;margin-bottom:4px}
.pick .s1{display:block;color:var(--dim);font-size:12.5px}
.pick .s2{display:block;color:var(--faint);font-size:12px;margin-top:7px;line-height:1.5}

.chk{display:flex;gap:9px;padding:6px 0;align-items:flex-start;font-size:13px}
.chk .m{flex:none;width:16px;font-weight:700}
.chk .hint{color:var(--dim);font-size:12.5px;margin-top:3px;white-space:pre-wrap}

#log{background:#0b1017;color:#cbd5e1;border-radius:var(--r);padding:13px 15px;max-height:320px;
  overflow:auto;font:12.5px/1.65 var(--mono);border:1px solid var(--line)}
#log p{margin:0;white-space:pre-wrap;word-break:break-word}
#log p.ok{color:#4ade80} #log p.bad{color:#f87171} #log p.dim{color:#64748b}

.empty{text-align:center;padding:44px 20px;color:var(--dim)}
.empty h3{font-size:15px;margin-bottom:8px;color:var(--fg)}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:11px 14px;
  border-radius:6px;font-size:12.5px;line-height:1.65;white-space:pre-wrap}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;font-size:13px;margin:0}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ========================================================================== *
 * 1. 小工具
 * ========================================================================== */

/**
 * 建 DOM。用它而不是拼 innerHTML：文本节点天然转义，事件直接挂在元素上，
 * 不需要 id 查找，也就没有"重渲染之后 ref 失效"这类问题。
 */
function h(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key.startsWith("on") && typeof value === "function") {
      node.addEventListener(key.slice(2), value);
    } else if (key === "class") {
      node.className = value;
    } else if (key in node && key !== "list" && key !== "form") {
      node[key] = value;
    } else {
      node.setAttribute(key, value);
    }
  }
  for (const kid of kids.flat(9)) {
    if (kid === null || kid === undefined || kid === false || kid === "") continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
const $ = (sel) => document.querySelector(sel);
const clear = (node) => { while (node.firstChild) node.firstChild.remove(); return node; };
/**
 * 条件渲染。
 *
 * **子节点传函数**（`when(x, () => h(...x.foo...))`）才是惰性的 —— JS 会先算完实参
 * 再调用，所以直接写 `when(x, h(...x.foo...))` 在 x 为 null 时会当场抛异常，
 * 整棵树渲染失败变成白屏。条件本身就是"这东西存在吗"的时候，一律用函数形式。
 */
const when = (cond, ...kids) =>
  (cond ? kids.map((k) => (typeof k === "function" ? k() : k)) : []);

/* ========================================================================== *
 * 2. 主题
 * ========================================================================== */

const THEMES = [["auto", "跟随系统", "◐"], ["light", "浅色", "☀"], ["dark", "深色", "☾"]];
const applyTheme = (mode) => {
  document.documentElement.dataset.theme = mode;
  localStorage.setItem("sleight_theme", mode);
};
applyTheme(localStorage.getItem("sleight_theme") || "auto");

const themeToggle = () => {
  const current = document.documentElement.dataset.theme;
  return h("div", { class: "row", style: "gap:2px" }, THEMES.map(([mode, label, glyph]) =>
    h("button", {
      class: "ghost sm", title: label, "aria-pressed": String(mode === current),
      style: mode === current ? "color:var(--fg);background:var(--bg)" : "",
      onclick: () => { applyTheme(mode); render(); },
    }, glyph)));
};

/* ========================================================================== *
 * 3. 状态与接口
 * ========================================================================== */

const S = {
  defaults: null,   // /api/defaults：字段解释、模板、缺省 spec —— 都由后端定义
  hosts: [],
  ref: null,        // 当前目标：主机/部署名
  tab: "overview",
  wizard: null,
  token: localStorage.getItem("sleight_ui_token") || "",
  stream: null,
};
const cache = { status: null, profiles: null, ext: null, plan: null };
const resetCache = () => { cache.status = cache.profiles = cache.ext = cache.plan = null; };

async function api(path, { method = "GET", body } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (S.token) headers["X-Sleight-Token"] = S.token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
  if (!res.ok) throw new Error((data && data.detail) || `HTTP ${res.status}`);
  return data;
}

/** 当前目标的接口地址。部署名走查询参数 —— 路径参数不匹配斜杠。 */
function url(suffix, extra) {
  const [host, deployment] = (S.ref || "").split("/");
  const query = new URLSearchParams(extra || {});
  if (deployment) query.set("deployment", deployment);
  const qs = query.toString();
  return `/api/hosts/${encodeURIComponent(host)}${suffix}${qs ? "?" + qs : ""}`;
}

const allDeployments = () => S.hosts.flatMap((x) => x.deployments || []);
const entry = () => allDeployments().find((d) => d.ref === S.ref) || null;
const hostOf = () => S.hosts.find((x) => x.name === (S.ref || "").split("/")[0]) || null;

/* ========================================================================== *
 * 4. 日志
 * ========================================================================== */

const LOG = h("div", { id: "log" });
const log = (text, kind) => {
  LOG.append(h("p", { class: kind || "" }, text));
  LOG.scrollTop = LOG.scrollHeight;
};
const wipe = () => clear(LOG);
const oops = (err) => log("✗ " + err.message, "bad");

/** 起一个后台 job，把进度流进日志。 */
async function runJob(path, body, done) {
  try {
    const { job } = await api(path, { method: "POST", body: body || {} });
    if (S.stream) S.stream.close();
    const query = S.token ? `?token=${encodeURIComponent(S.token)}` : "";
    const source = new EventSource(`/api/jobs/${job}/events${query}`);
    S.stream = source;
    source.addEventListener("line", (e) => log("  " + JSON.parse(e.data).text));
    source.addEventListener("done", (e) => {
      const finished = JSON.parse(e.data);
      source.close();
      S.stream = null;
      if (finished.status === "ok") { log("✓ 完成", "ok"); if (done) done(finished.result); }
      else log("✗ " + finished.error, "bad");
    });
    source.onerror = () => {
      if (S.stream === source) { source.close(); S.stream = null; log("(事件流断开)", "dim"); }
    };
  } catch (err) { oops(err); }
}

/* ========================================================================== *
 * 5. 组件。字段的解释和推荐值全部来自后端，这里不写死任何一条
 * ========================================================================== */

const helpOf = (key) => (S.defaults && S.defaults.help[key]) || { label: key, why: "", recommend: "" };

function field(key, opts) {
  const meta = helpOf(key);
  const control = opts.options
    ? h("select", { onchange: (e) => opts.onInput(e.target.value) },
        opts.options.map(([v, t]) => h("option", { value: v, selected: v === opts.value }, t)))
    : h("input", {
        type: opts.type || "text", value: opts.value ?? "", placeholder: opts.placeholder || "",
        oninput: (e) => opts.onInput(e.target.value),
      });
  return h("div", { class: "field" },
    h("label", null, opts.label || meta.label),
    when(meta.why, h("div", { class: "why" }, meta.why)),
    control,
    when(meta.recommend, h("div", { class: "rec" }, meta.recommend)));
}

function checkbox(key, checked, onInput) {
  const meta = helpOf(key);
  return h("div", { class: "field" },
    h("label", { class: "check" },
      h("input", { type: "checkbox", checked, onchange: (e) => onInput(e.target.checked) }),
      h("span", null,
        h("b", { style: "font-size:13px" }, meta.label),
        when(meta.why, h("div", { class: "why", style: "margin:2px 0 0" }, meta.why)),
        when(meta.recommend, h("div", { class: "rec" }, meta.recommend)))));
}

const card = (title, sub, ...kids) => h("div", { class: "card" },
  when(title, h("h2", null, title)), when(sub, h("div", { class: "sub" }, sub)), ...kids);

const badge = (kind, text) => h("span", { class: "badge " + kind }, text);

const copyable = (value) => h("span", { class: "row", style: "gap:8px" },
  h("code", { class: "mono", style: "flex:1;word-break:break-all" }, value),
  h("button", {
    class: "sm ghost",
    onclick: async (e) => {
      const btn = e.target;
      try { await navigator.clipboard.writeText(value); btn.textContent = "已复制"; }
      catch { btn.textContent = "复制失败"; }
      setTimeout(() => { btn.textContent = "复制"; }, 1500);
    },
  }, "复制"));

const MARK = { ok: ["✓", "var(--ok)"], warn: ["!", "var(--warn)"], fail: ["✗", "var(--bad)"] };
const checkList = (checks) => h("div", null, checks.map((c) => h("div", { class: "chk" },
  h("span", { class: "m", style: "color:" + MARK[c.level][1] }, MARK[c.level][0]),
  h("div", null, h("span", null, h("b", null, c.name), " ", c.detail),
    when(c.hint, h("div", { class: "hint" }, "→ " + c.hint))))));

/* ========================================================================== *
 * 6. 引导：连接目标机 → 选规模 → 体检并创建
 * ========================================================================== */

function startWizard(seed) {
  const stock = S.defaults.spec;
  S.wizard = {
    step: seed ? 2 : 1,      // 已知主机就跳过第一步
    host: seed || { name: "", ssh: "", port: "", identity: "", sudo: false,
                    accept_new: false, notes: "" },
    lockHost: Boolean(seed),
    probe: null,
    template: "standard",
    deployment: seed ? "second" : "default",
    spec: { dir: stock.dir, image: stock.image, port: stock.port,
            bind_ip: stock.bind_ip, shm_size: "5gb", expose: false },
    saved: false,
    plan: null,
  };
  S.tab = "wizard";
  render();
}

const wizardView = () => {
  const w = S.wizard;
  const steps = (w.lockHost ? [] : [["连接目标机", 1]])
    .concat([["选择规模", 2], ["体检并创建", 3]]);
  return h("div", { class: "stack" },
    h("div", { class: "steps" }, steps.map(([label, n]) =>
      h("div", { class: "s", "data-on": String(w.step === n), "data-done": String(w.step > n) },
        h("span", { class: "n" }, w.step > n ? "✓" : String(n)), h("span", null, label)))),
    [wizardStep1, wizardStep2, wizardStep3][w.step - 1]());
};

function wizardStep1() {
  const w = S.wizard;
  const remote = Boolean(w.host.ssh.trim());
  return card("① 这个 Manager 装在哪台机器上",
    "目标机需要 docker 和 compose v2；远程还需要 sshd。**那台机上不用装 sleight。**",
    h("div", { class: "grid2" },
      h("div", null,
        field("host_name", { value: w.host.name, placeholder: "hk-01",
                             onInput: (v) => { w.host.name = v; } }),
        field("ssh", { value: w.host.ssh, placeholder: "deploy@1.2.3.4，留空 = 本机",
                       onInput: (v) => { w.host.ssh = v; scheduleRender(); } }),
        when(remote,
          field("ssh_port", { value: w.host.port, type: "number", placeholder: "22",
                              onInput: (v) => { w.host.port = v; } }),
          field("identity", { value: w.host.identity, placeholder: "~/.ssh/id_ed25519",
                              onInput: (v) => { w.host.identity = v; } }))),
      h("div", null,
        field("notes", { value: w.host.notes, placeholder: "香港那台",
                         onInput: (v) => { w.host.notes = v; } }),
        when(remote, checkbox("accept_new", w.host.accept_new, (v) => { w.host.accept_new = v; })),
        checkbox("sudo", w.host.sudo, (v) => { w.host.sudo = v; }))),
    h("div", { class: "row" },
      h("button", { class: "primary", onclick: doProbe }, "测试连接"),
      h("button", {
        disabled: !w.probe || !w.probe.ok || !w.host.name.trim(),
        onclick: () => { w.step = 2; render(); },
      }, "下一步 →"),
      when(!w.host.name.trim(), h("span", { class: "tiny muted" }, "先给这台机起个名字"))),
    when(w.probe, () => h("div", { style: "margin-top:14px" },
      checkList((w.probe.steps || []).map((s) => ({
        name: s.name, level: s.ok ? "ok" : "fail", detail: s.detail, hint: "" }))),
      when(w.probe.hint, h("div", { class: "callout bad", style: "margin-top:10px" }, w.probe.hint)),
      when(w.probe.ok && !w.probe.hint,
        h("div", { class: "callout ok", style: "margin-top:10px" },
          "连得上，docker 也在。可以下一步。")))));
}

async function doProbe() {
  const w = S.wizard;
  w.probe = { steps: [{ name: "测试中", ok: true, detail: "…" }], ok: false, hint: "" };
  render();
  try {
    w.probe = await api("/api/probe", { method: "POST", body: {
      ssh: w.host.ssh.trim(), port: w.host.port ? Number(w.host.port) : null,
      identity: w.host.identity.trim(), accept_new: w.host.accept_new } });
  } catch (err) {
    w.probe = { ok: false, steps: [], hint: err.message };
  }
  render();
}

function wizardStep2() {
  const w = S.wizard;
  return h("div", { class: "stack" },
    card("② 打算跑多少个浏览器实例",
      "决定 /dev/shm 大小和监听方式。选错不致命 —— 之后改参数重新部署即可。",
      h("div", { class: "pick" }, S.defaults.deploy_templates.map((t) =>

async function saveAndCheck() {
  const w = S.wizard;
  const deployment = (w.deployment || "default").trim();
  wipe();
  try {
    if (!w.saved) {
      if (w.lockHost) {
        await api("/api/deployments", { method: "POST", body: {
          host: w.host.name, name: deployment, spec: w.spec } });
      } else {
        await api("/api/hosts", { method: "POST", body: {
          name: w.host.name.trim(), ssh: w.host.ssh.trim(),
          port: w.host.port ? Number(w.host.port) : null, identity: w.host.identity.trim(),
          sudo: w.host.sudo, accept_new: w.host.accept_new, notes: w.host.notes.trim(),
          deployment, deploy: w.spec } });
      }
      w.saved = true;
      log("已存进本地库", "ok");
    }
    S.ref = `${w.host.name.trim()}/${deployment}`;
    await loadHosts();
    w.step = 3;
    w.plan = null;
    render();
    w.plan = await api(url("/preflight"), { method: "POST", body: { spec: w.spec } });
    render();
  } catch (err) {
    oops(err);
    w.saved = false;
  }
}

function wizardStep3() {
  const w = S.wizard;
  if (!w.plan) return card("③ 体检中", "正在连上去看环境…");
  return h("div", { class: "stack" },
    card("③ 体检结果", w.plan.blocked ? "有硬性问题，解决了再部署。" : "可以部署了。",
      checkList(w.plan.checks),
      when(w.plan.warnings.length,
        h("div", { class: "callout", style: "margin-top:12px" }, w.plan.warnings.join("\n"))),
      h("div", { class: "row", style: "margin-top:14px" },
        h("button", { onclick: () => { w.step = 2; render(); } }, "← 改参数"),
        h("button", {
          class: "primary", disabled: w.plan.blocked,
          onclick: () => startDeploy(w.spec, false),
        }, w.plan.blocked ? "先解决上面的问题" : "开始部署"),
        when(w.plan.blocked, h("button", {
          class: "danger", onclick: () => startDeploy(w.spec, true),
        }, "无视并强制部署")))),
    filesPanel(w.plan.files));
}

function startDeploy(spec, force) {
  wipe();
  log("开始部署。目标机上没有镜像的话要拉 1.6 GB，可能几分钟。", "dim");
  runJob(url("/deploy"), { spec, force }, (r) => {
    log(r.summary, "ok");
    log("地址 " + r.url, "ok");
    log("token 在目标机 " + r.env_path + "（权限 600）—— 概览页点「显示 token」取完整值", "dim");
    S.wizard = null;

function overviewView() {

  const state = cache.status;
  const container = state.container;
  const manager = state.api || {};
  const running = container.status === "running";
  const level = running ? "ok" : container.status === "absent" ? "idle" : "bad";
  const record = entry();

  return h("div", { class: "stack" },
    card(null, null,
      h("div", { class: "row", style: "justify-content:space-between;margin-bottom:14px" },
        h("div", { class: "row" }, h("h2", null, S.ref),

        h("div", { class: "row" },
          h("button", { class: "sm", onclick: () => fetchStatus(true) }, "刷新"),

          h("button", { class: "sm", onclick: showHistory }, "操作流水"))),

        h("dt", null, "部署目录"), h("dd", null, state.dir),
        h("dt", null, "镜像"), h("dd", null, container.image || "—"),
        h("dt", null, "端口映射"), h("dd", null, (state.ports || []).join("  ") || "—"),
        h("dt", null, "Manager"), h("dd", null, manager.binary_version
          ? `浏览器内核 ${manager.binary_version} · 实例 ${manager.profiles_total} 个`
            + ` · 运行中 ${manager.running_count} 个`
          : "/api/status 无响应"),
        h("dt", null, "上次部署"), h("dd", null, (record && record.deployed_at) || "从未"))),

    when(container.status === "absent",
      card("还没部署", "这条记录里已经有配置了，但目标机上还没有容器。",
        h("button", { class: "primary", onclick: () => { S.tab = "deploy"; render(); } },
          "去部署 →"))),

    when(running, card("运维", "",
      h("div", { class: "row" },
        h("button", { onclick: () => { wipe();
          runJob(url("/backup"), {}, (r) => log("归档 " + r.archive, "ok")); } }, "停机备份"),
        h("button", { onclick: () => { wipe();
          runJob(url("/rollback"), {}, (r) => log(r.summary, "ok")); } }, "回滚到上一个镜像")),
      h("div", { class: "field", style: "margin-top:14px;margin-bottom:0" },
        h("label", null, "升级到指定镜像"),
        h("div", { class: "why" },

        h("div", { class: "row" },

async function profileAction(pid, action) {
  wipe(); log(action + "…（拉起一个实例要几十秒）", "dim");

async function dropProfile(p) {
  const typed = window.prompt(
    `删除实例会连它的登录态一起删掉，不可逆。\n确认请把名字原样输入：${p.name}`, "");

  wipe();
  try {
    await api(url(`/profiles/${encodeURIComponent(p.id)}`, { confirm: typed }),
              { method: "DELETE" });
    log("已删除 " + p.name, "bad");
    fetchProfiles(true);
  } catch (err) { oops(err); }
}

          wipe(); log("会拉起实例并等 service worker 起来，要几十秒。", "dim");
          runJob(url("/extensions/verify"), { launch: true },
                 (rows) => rows.forEach((r) => log(r.summary, r.ok ? "ok" : "bad")));
        } }, "验证真的加载了"),
        h("button", { onclick: showDrift }, "查漂移"))));
}

async function fetchExt(force) {
  if (force) cache.ext = null;
  try { cache.ext = await api(url("/extensions")); }
  catch (err) { cache.ext = []; oops(err); }
  render();
}

async function showDrift() {
  wipe();
  try {
    const report = await api(url("/extensions/drift"));
    for (const p of report.profiles) {
      const missing = p.missing.map((m) => m.split("/").pop()).join(",") || "—";
      log(`${p.name || p.id}   已配 ${p.configured.length}   缺 ${missing}`,
          p.missing.length ? "bad" : "");
    }
    log(report.consistent
      ? "一致：每个实例都配了目标机上装的全部插件。"
      : "不一致。lease() 随机租实例，漏掉的那台会造成概率性失败 —— 点「下发到全部实例」修。",
      report.consistent ? "ok" : "bad");
  } catch (err) { oops(err); }
}

/* ========================================================================== *
 * 11. 危险区 —— 四种「删」的作用范围完全不同
 * ========================================================================== */

function dangerView() {
  const host = hostOf();
  const implicit = Boolean(host && host.implicit);
  const running = Boolean(cache.status && cache.status.container
                          && cache.status.container.status === "running");

  return h("div", { class: "stack" },
    h("div", { class: "callout" },
      "这里有四种「删」，作用范围完全不同：\n"
      + "①  删容器 —— 目标机上的容器没了，data/ 还在，重新部署即可恢复\n"
      + "②  删 data/ —— 登录态一起没，不可逆\n"
      + "③  删镜像 —— 磁盘腾出来了，下次部署要重新拉\n"
      + "④  删记录 —— 只是这台控制机不再记得它，目标机毫发无伤"),

    card("① 停并删容器", "data/ 原封不动，登录态都还在。",
      h("button", { class: "danger", onclick: () => {
        wipe();
        runJob(url("/destroy"), { purge_data: false }, () => {
          log("容器已删，data/ 保留", "ok"); fetchStatus(true);
        });
      } }, "停并删容器")),

    card("② 连 data/ 一起删",
      "不可逆。实例数据库、指纹种子、Cookie 和全部登录态一起消失。",
      h("div", { class: "field" },
        h("label", null, "确认"),
        h("div", { class: "why" }, `把 ${S.ref} 原样输入才会执行。`),
        h("input", { id: "purge_confirm", type: "text", placeholder: S.ref })),
      h("label", { class: "row" },
        h("input", { id: "purge_image_too", type: "checkbox" }),
        h("span", null, "顺手把镜像也删了（彻底清场）")),
      h("button", { class: "danger primary", onclick: () => {
        wipe();
        const alsoImage = $("#purge_image_too").checked;
        runJob(url("/destroy"), {
          purge_data: true, purge_image: alsoImage,
          confirm: $("#purge_confirm").value.trim(),
        }, () => {
          log(alsoImage ? "容器、data/、镜像都删了" : "容器和 data/ 都删了", "bad");
          fetchStatus(true);
        });
      } }, "连 data/ 一起删")),

    card("③ 连镜像一起删",
      "容器 + 镜像。data/ 留着。腾磁盘用，代价是下次部署要重新拉镜像（几百 MB 到几 GB）。"
      + "同一台机上还有别的部署在用这个镜像的话删不掉 —— 那不是错误，日志里会说。",
      h("button", { class: "danger", onclick: () => {
        wipe();
        runJob(url("/destroy"), { purge_data: false, purge_image: true }, () => {
          log("容器和镜像都删了，data/ 保留", "ok"); fetchStatus(true);
        });
      } }, "删容器和镜像")),

    card("④ 只删本地记录", "目标机上的东西一点不碰。",
      when(implicit, h("div", { class: "callout" },
        "「本机」是内置目标，删不掉 —— 删了列表里还会有它。它不占用任何资源。")),
      when(running && !implicit, h("div", { class: "callout" },
        "目标机上的容器还在跑。只删记录的话它会变成没人管的孤儿 —— "
        + "以后要拆就得手工上去。建议先用上面的①。")),
      h("div", { class: "row" },
        h("button", { class: "danger", disabled: implicit, onclick: dropDeployment },
          "删这条部署记录"),
        h("button", { class: "danger", disabled: implicit, onclick: dropHost },
          "删整台主机的记录"))));
}

async function dropDeployment() {
  const [host, deployment] = S.ref.split("/");
  if (!window.confirm(`只从本地库删掉 ${S.ref}。目标机上的容器和数据不受影响。`)) return;
  wipe();
  try {
    await api(`/api/deployments/${encodeURIComponent(host)}/${encodeURIComponent(deployment)}`,
              { method: "DELETE" });
    log("已删掉这条部署记录（目标机没动）", "ok");
    S.ref = null; resetCache(); await loadHosts(); render();
  } catch (err) { oops(err); }
}

async function dropHost() {
  const host = S.ref.split("/")[0];
  if (!window.confirm(`连同 ${host} 下的全部部署记录一起删。目标机不受影响。`)) return;
  wipe();
  try {
    await api(`/api/hosts/${encodeURIComponent(host)}`, { method: "DELETE" });
    log("整台主机的记录都删了（目标机没动）", "ok");
    S.ref = null; resetCache(); await loadHosts(); render();
  } catch (err) { oops(err); }
}

/* ========================================================================== *
 * 12. 侧栏与渲染
 * ========================================================================== */

function sidebar() {
  return h("aside", null,
    h("div", { class: "eyebrow" }, "目标"),
    S.hosts.map((host) => h("div", { class: "hostgroup" },
      h("div", { class: "name" },
        host.local ? "🖥" : "🌐", host.name,
        when(host.implicit, badge("idle", "内置")),
        when(host.notes, h("span", { class: "tiny muted", style: "font-weight:400" }, host.notes))),
      (host.deployments || []).map((d) => h("button", {
        class: "target", "aria-current": String(S.ref === d.ref),
        onclick: () => {
          S.ref = d.ref; S.tab = "overview"; S.wizard = null; resetCache(); render();
        },
      }, h("b", null, d.name),
         h("span", { class: "meta" }, `${d.spec.dir}:${d.spec.port}`),
         h("span", { class: "meta" },
           d.deployed_at ? "部署于 " + d.deployed_at.slice(0, 16).replace("T", " ") : "从未部署"))),
      when(!host.implicit, h("button", {
        class: "ghost sm", style: "margin-left:6px",
        onclick: () => startWizard({
          name: host.name, ssh: host.ssh, port: host.port || "", identity: host.identity,
          sudo: host.sudo, accept_new: false, notes: host.notes }),
      }, "＋ 这台机上再加一个")))),
    h("button", { class: "primary", style: "width:100%;margin-top:6px",
                  onclick: () => startWizard(null) }, "＋ 添加目标机"));
}

const TABS = [["overview", "概览"], ["deploy", "部署"], ["profiles", "实例"],
              ["ext", "插件"], ["danger", "危险区"]];

function body() {
  if (S.tab === "wizard") return wizardView();
  if (!S.ref) {
    return h("div", { class: "empty" },
      h("h3", null, "先添加一台目标机"),
      h("div", null, "目标机需要 docker 和 compose v2；远程还要 sshd。那台机上不用装 sleight。"),
      h("div", { style: "margin-top:16px" },
        h("button", { class: "primary", onclick: () => startWizard(null) }, "开始引导")));
  }
  const views = { overview: overviewView, deploy: deployView, profiles: profilesView,
                  ext: extView, danger: dangerView };
  return h("div", null,
    h("nav", { class: "tabs" }, TABS.map(([key, label]) =>
      h("button", { "aria-current": String(S.tab === key),
                    onclick: () => { S.tab = key; render(); } }, label))),
    views[S.tab]());
}

function render() {
  clear($("#app")).append(
    h("header", null,
      h("h1", null, "sleight deploy"),
      h("span", { class: "ver" }, S.defaults ? "v" + S.defaults.version : ""),
      h("span", { class: "spacer" }),
      when(S.defaults && S.defaults.auth, h("input", {
        type: "text", value: S.token, placeholder: "访问口令", style: "width:170px",
        onchange: (e) => {
          S.token = e.target.value.trim();
          localStorage.setItem("sleight_ui_token", S.token);
          boot();
        },
      })),
      themeToggle()),
    h("main", null, sidebar(),
      h("section", { class: "body" }, body(),
        h("div", { style: "margin-top:22px" }, h("div", { class: "eyebrow" }, "日志"), LOG))));
}

/** 合并同一帧内的多次重绘，避免输入时整树重建打断打字。 */
let queued = false;
function scheduleRender() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; render(); });
}

const loadHosts = async () => { S.hosts = await api("/api/hosts"); };

async function boot() {
  try {
    S.defaults = await api("/api/defaults");
    await loadHosts();
    if (!S.ref) {
      // 优先选一个部署过的；一个都没部署过就选第一个 —— 空状态只留给"真的一台都没有"
      const all = allDeployments();
      S.ref = (all.find((d) => d.deployed_at) || all[0] || {}).ref || null;
    }
    render();
  } catch (err) {
    clear($("#app")).append(h("div", { class: "empty" },
      h("h3", null, "连不上后端"), h("div", null, err.message),
      h("div", { class: "tiny muted", style: "margin-top:10px" },
        "启动时给了 --token 的话，在右上角填一下。")));
  }
}

const fromUrl = new URLSearchParams(location.search).get("token");
if (fromUrl) { S.token = fromUrl; localStorage.setItem("sleight_ui_token", fromUrl); }
boot();
</script>
</body>
</html>
