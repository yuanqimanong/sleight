<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sleight deploy</title>
<style>
  :root {
    --bg: #10151c; --panel: #171d26; --line: #26303d; --fg: #dfe6ef; --dim: #8b97a8;
    --ok: #4ec98a; --warn: #e6b455; --bad: #e2685f; --acc: #5aa9f0; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f7fa; --panel:#fff; --line:#dde3ec; --fg:#1c2430; --dim:#5d6a7c;
            --ok:#12855a; --warn:#8a6212; --bad:#c0372c; --acc:#1b6fc4; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 20px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .v { color:var(--dim); font-size:12px; font-family:var(--mono); }
  header .sp { flex:1; }
  main { display:grid; grid-template-columns:262px 1fr; gap:0; align-items:start; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  aside { border-right:1px solid var(--line); min-height:calc(100vh - 50px); padding:14px; }
  section.body { padding:18px 20px 40px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim);
       margin:0 0 10px; font-weight:600; }
  .host { display:block; width:100%; text-align:left; padding:8px 10px; margin-bottom:4px;
          background:transparent; color:var(--fg); border:1px solid transparent;
          border-radius:7px; cursor:pointer; font:inherit; }
  .host:hover { background:var(--panel); }
  .host.on { background:var(--panel); border-color:var(--acc); }
  .host b { display:block; font-weight:600; }
  .host span { color:var(--dim); font-size:12px; font-family:var(--mono); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .tabs { display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { background:transparent; border:1px solid var(--line); color:var(--dim);
                 padding:6px 12px; border-radius:7px; cursor:pointer; font:inherit; }
  .tabs button.on { color:var(--fg); border-color:var(--acc); background:var(--panel); }
  button.go { background:var(--acc); border:0; color:#fff; padding:7px 14px; border-radius:7px;
              cursor:pointer; font:inherit; font-weight:600; }
  button.go.danger { background:var(--bad); }
  button.go:disabled { opacity:.5; cursor:default; }
  button.mini { background:transparent; border:1px solid var(--line); color:var(--fg);
                padding:3px 9px; border-radius:6px; cursor:pointer; font:inherit; font-size:12px; }
  label { display:block; font-size:12px; color:var(--dim); margin:8px 0 3px; }
  input, select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line);
                  border-radius:6px; padding:6px 9px; font:inherit; font-family:var(--mono);
                  font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0 14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:600; font-size:12px;
       border-bottom:1px solid var(--line); padding:6px 8px; }
  td { padding:6px 8px; border-bottom:1px solid var(--line); font-family:var(--mono); }
  .scroll { overflow-x:auto; }
  pre { font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word;
        margin:0; }
  #log { background:#0b0f14; color:#cfe0f0; border:1px solid var(--line); border-radius:10px;
         padding:12px 14px; max-height:340px; overflow:auto; }
  @media (prefers-color-scheme: light) { #log { background:#0d1218; } }
  .chk { padding:3px 0; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .dim { color:var(--dim); }
  .pill { font-family:var(--mono); font-size:11.5px; padding:1px 7px; border-radius:20px;
          border:1px solid var(--line); }
  .note { color:var(--dim); font-size:12.5px; margin-top:8px; }
  code { font-family:var(--mono); background:var(--bg); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>sleight deploy</h1>
  <span class="v" id="ver"></span>
  <span class="sp"></span>
  <span class="v" id="tokwrap" hidden>口令 <input id="tok" style="width:180px;display:inline-block"></span>
</header>

<main>
  <aside>
    <h2>目标机</h2>
    <div id="hosts"></div>
    <details style="margin-top:14px">
      <summary class="dim" style="cursor:pointer;font-size:12.5px">加一台</summary>
      <label>名字</label><input id="h_name" placeholder="hk-01">
      <label>SSH（留空 = 本机）</label><input id="h_ssh" placeholder="deploy@1.2.3.4">
      <label>SSH 端口</label><input id="h_sshport" placeholder="22">
      <label>私钥</label><input id="h_key" placeholder="~/.ssh/id_ed25519">
      <label>部署目录</label><input id="h_dir">
      <label>Manager 端口</label><input id="h_port" placeholder="9000">
      <label>备注</label><input id="h_notes" placeholder="香港那台">
      <label><input type="checkbox" id="h_sudo" style="width:auto"> 用 sudo -n 建目录</label>
      <label><input type="checkbox" id="h_new" style="width:auto"> 首次连接信任指纹</label>
      <div class="row"><button class="go" id="h_add">保存</button></div>
    </details>
    <details style="margin-top:8px">
      <summary class="dim" style="cursor:pointer;font-size:12.5px">在已有主机上再加一个 Manager</summary>
      <label>主机</label><input id="d_host" placeholder="hk-01">
      <label>这个 Manager 的名字</label><input id="d_name" placeholder="second">
      <label>部署目录（不能和同机其它部署重）</label><input id="d_dir2">
      <label>端口</label><input id="d_port2" placeholder="9001">
      <div class="row"><button class="go" id="d_add">保存</button></div>
      <div class="note">项目名和容器名会自动按这个名字加后缀 —— 不加的话第二个
        Manager 会把第一个的容器删掉。</div>
    </details>
  </aside>

  <section class="body">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
    <h2 style="margin-top:18px">日志</h2>
    <div id="log"><pre class="dim">选一台目标机开始。所有动作的进度会实时打在这里。</pre></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let HOSTS = [], CUR = null, TAB = "overview", DEFAULTS = null, ES = null;

/* ---------- 基础 ---------- */
function token() { return $("tok").value.trim(); }
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token()) headers["X-Sleight-Token"] = token();
  const r = await fetch(path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
  if (!r.ok) throw new Error((data && data.detail) || `HTTP ${r.status}`);
  return data;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function log(line, cls = "") {
  const pre = document.createElement("pre");
  if (cls) pre.className = cls;
  pre.textContent = line;
  $("log").appendChild(pre);
  $("log").scrollTop = $("log").scrollHeight;
}
function clearLog() { $("log").innerHTML = ""; }
function fail(e) { log("✗ " + e.message, "bad"); }

/* ---------- 主机 ---------- */
async function loadHosts() {
  HOSTS = await api("/api/hosts");
  // 一台主机可以跑多个 Manager，所以侧栏选的是"部署"（主机/部署名）而不是主机
  $("hosts").innerHTML = HOSTS.map((h) => {
    const items = (h.deployments || []).map((d) => `
      <button class="host ${CUR === d.ref ? "on" : ""}" data-h="${esc(d.ref)}">
        <b>${esc(d.ref)}${h.implicit ? ' <span class="pill">本机</span>' : ""}</b>
        <span>${esc(h.ssh || "本机")} · ${esc(d.spec.dir)}:${d.spec.port}</span>
        <span class="dim">${d.deployed_at ? "部署于 " + esc(d.deployed_at) : "从未部署"}</span>
      </button>`).join("");
    return items || `
      <button class="host" data-h="${esc(h.name)}">
        <b>${esc(h.name)}</b><span class="dim">还没有 Manager</span>
      </button>`;
  }).join("");
  $("hosts").querySelectorAll("[data-h]").forEach((b) =>
    b.onclick = () => { CUR = b.dataset.h; loadHosts(); render(); });
  if (!CUR && HOSTS.length) {
    const first = HOSTS.find((h) => (h.deployments || []).length);
    CUR = first ? first.deployments[0].ref : HOSTS[0].name;
    loadHosts(); render();
  }
}

/* 当前选中的部署 → 接口 URL。部署名走查询参数，路径参数不匹配斜杠 */
function url(suffix, extra) {
  const [h, d] = CUR.split("/");
  const params = new URLSearchParams(extra || {});
  if (d) params.set("deployment", d);
  const query = params.toString();
  return `/api/hosts/${encodeURIComponent(h)}${suffix}${query ? "?" + query : ""}`;
}

/* 当前选中的那条部署记录 */
function entry() {
  for (const h of HOSTS) for (const d of h.deployments || []) if (d.ref === CUR) return d;
  return null;
}
$("h_add").onclick = async () => {
  try {
    await api("/api/hosts", { method: "POST", body: {
      name: $("h_name").value.trim(), ssh: $("h_ssh").value.trim(),
      port: $("h_sshport").value ? Number($("h_sshport").value) : null,
      identity: $("h_key").value.trim(), sudo: $("h_sudo").checked,
      accept_new: $("h_new").checked, notes: $("h_notes").value.trim(),
      deploy: {
        ...($("h_dir").value.trim() ? { dir: $("h_dir").value.trim() } : {}),
        ...($("h_port").value ? { port: Number($("h_port").value) } : {}),
      },
    }});
    log("已保存到本地库", "ok");
    CUR = $("h_name").value.trim() + "/default";
    await loadHosts(); render();
  } catch (e) { fail(e); }
};

$("d_add").onclick = async () => {
  try {
    await api("/api/deployments", { method: "POST", body: {
      host: $("d_host").value.trim(), name: $("d_name").value.trim(),
      spec: {
        ...($("d_dir2").value.trim() ? { dir: $("d_dir2").value.trim() } : {}),
        ...($("d_port2").value ? { port: Number($("d_port2").value) } : {}),
      },
    }});
    log("已加入本地库", "ok");
    CUR = `${$("d_host").value.trim()}/${$("d_name").value.trim()}`;
    await loadHosts(); render();
  } catch (e) { fail(e); }
};

/* ---------- job 流 ---------- */
function follow(jobId, done) {
  if (ES) ES.close();
  const q = token() ? `?token=${encodeURIComponent(token())}` : "";
  ES = new EventSource(`/api/jobs/${jobId}/events${q}`);
  ES.addEventListener("line", (e) => log("  · " + JSON.parse(e.data).text));
  ES.addEventListener("done", (e) => {
    const job = JSON.parse(e.data);
    ES.close(); ES = null;
    if (job.status === "ok") { log("✓ 完成", "ok"); done && done(job.result); }
    else log("✗ " + job.error, "bad");
  });
  ES.onerror = () => { if (ES) { ES.close(); ES = null; log("(事件流断开)", "dim"); } };
}
async function job(path, body, done) {
  try {
    const r = await api(path, { method: "POST", body: body || {} });
    follow(r.job, done);
  } catch (e) { fail(e); }
}

/* ---------- 视图 ---------- */
const TABS = [["overview", "概览"], ["deploy", "部署"], ["profiles", "Profile"], ["ext", "插件"]];
function render() {
  $("tabs").innerHTML = TABS.map(([k, t]) =>
    `<button class="${TAB === k ? "on" : ""}" data-t="${k}">${t}</button>`).join("");
  $("tabs").querySelectorAll("[data-t]").forEach((b) =>
    b.onclick = () => { TAB = b.dataset.t; render(); });
  if (!CUR) { $("view").innerHTML = `<div class="card dim">左边选一台目标机。</div>`; return; }
  ({ overview: viewOverview, deploy: viewDeploy, profiles: viewProfiles, ext: viewExt })[TAB]();
}
const host = () => entry() || { spec: {} };

/* —— 概览 —— */
async function viewOverview() {
  $("view").innerHTML = `<div class="card dim">读取状态…</div>`;
  try {
    const s = await api(url("/status"));
    const c = s.container, a = s.api || {};
    const cls = c.status === "running" ? "ok" : c.status === "absent" ? "dim" : "bad";
    $("view").innerHTML = `
      <div class="card">
        <table>
          <tr><th>目标</th><td>${esc(s.target)}</td></tr>
          <tr><th>目录</th><td>${esc(s.dir)}</td></tr>
          <tr><th>容器</th><td class="${cls}">${esc(c.status)} · 健康 ${esc(c.health)}</td></tr>
          <tr><th>镜像</th><td>${esc(c.image || "—")}</td></tr>
          <tr><th>端口</th><td>${esc((s.ports || []).join("  ") || "—")}</td></tr>
          <tr><th>Manager</th><td>${a.binary_version
            ? `内核 ${esc(a.binary_version)} · profile ${a.profiles_total} 个 · 运行中 ${a.running_count} 个`
            : '<span class="dim">/api/status 无响应</span>'}</td></tr>
          <tr><th>上次部署</th><td>${esc((s.state_file || {}).deployed_at || "—")}</td></tr>
        </table>
        <div class="row">
          <button class="mini" id="b_logs">看日志</button>
          <button class="mini" id="b_token">显示 token</button>
          <button class="mini" id="b_hist">流水</button>
          <button class="mini" id="b_reload">刷新</button>
        </div>
      </div>
      <div class="card">
        <h2>运维</h2>
        <div class="row">
          <button class="mini" id="b_backup">停机备份</button>
          <input id="b_image" placeholder="cloakhq/cloakbrowser-manager:v0.0.11"
                 style="flex:1;min-width:220px">
          <button class="mini" id="b_upgrade">升级到这个镜像</button>
          <button class="mini" id="b_rollback">回滚上一个</button>
        </div>
        <div class="note">备份要停机 —— 在线复制 SQLite 会拿到和浏览器用户目录不一致的
          时间点。升级默认先备份；回滚用的是状态文件里记着的上一个镜像。</div>
      </div>
      <div class="card">
        <h2>危险动作</h2>
        <div class="row">
          <button class="go danger" id="b_destroy">停并删容器（保留 data/）</button>
        </div>
        <div class="row">
          <input id="b_confirm" placeholder="要连 data/ 一起删，把 ${esc(CUR)} 原样打在这里"
                 style="flex:1;min-width:260px">
          <button class="go danger" id="b_purge">连 data/ 一起删</button>
        </div>
        <div class="note">删 data/ 不可逆：profile 数据库、指纹种子、Cookie 和全部登录态
          都在里面。删容器本身不会丢这些。</div>
      </div>
      <div class="card">
        <h2>这条记录</h2>
        <div class="row">
          <button class="mini" id="b_rmdepl">从库里删掉这个部署</button>
          <button class="mini" id="b_rmhost">删掉整台主机及其全部部署</button>
        </div>
        <div class="note">只动本地库，**目标机上的东西一点不碰**。要真的拆掉 Manager
          请先用上面的"危险动作"。</div>
      </div>`;
    $("b_reload").onclick = viewOverview;
    $("b_token").onclick = async () => {
      clearLog();
      try {
        const t = await api(url("/token"));
        log("AUTH_TOKEN  " + t.token, "ok");
        log("目标机上    " + t.url + "   （远程的话先 sleight tunnel）");
        log("它存在      " + t.env_path + "（权限 600）");
        log("Manager 没有用户名密码 —— 这个 token 就是唯一凭据。", "dim");
      } catch (e) { fail(e); }
    };
    $("b_upgrade").onclick = () => {
      const image = $("b_image").value.trim();
      if (!image) return fail(new Error("先填要升级到的镜像"));
      clearLog(); log("升级前会先做一次停机备份…", "dim");
      job(url("/upgrade"), { image, backup: true }, (r) => log(r.summary, "ok"));
    };
    $("b_rollback").onclick = () => {
      clearLog();
      job(url("/rollback"), {}, (r) => log(r.summary, "ok"));
    };
    $("b_destroy").onclick = () => {
      clearLog();
      job(url("/destroy"), { purge_data: false }, () => { log("容器已删，data/ 保留", "ok"); viewOverview(); });
    };
    $("b_purge").onclick = () => {
      clearLog();
      job(url("/destroy"), { purge_data: true, confirm: $("b_confirm").value.trim() },
          () => { log("容器和 data/ 都删了", "bad"); viewOverview(); });
    };
    $("b_rmdepl").onclick = async () => {
      clearLog();
      const [h, d] = CUR.split("/");
      try {
        await api(`/api/deployments/${encodeURIComponent(h)}/${encodeURIComponent(d || "default")}`,
                  { method: "DELETE" });
        log("已从库里删掉（目标机没动）", "ok");
        CUR = null; await loadHosts(); render();
      } catch (e) { fail(e); }
    };
    $("b_rmhost").onclick = async () => {
      clearLog();
      try {
        await api(`/api/hosts/${encodeURIComponent(CUR.split("/")[0])}`, { method: "DELETE" });
        log("整台主机的记录都删了（目标机没动）", "ok");
        CUR = null; await loadHosts(); render();
      } catch (e) { fail(e); }
    };
    $("b_hist").onclick = async () => {
      clearLog();
      try {
        const host = CUR.split("/")[0];
        const rows = await api(`/api/events?host=${encodeURIComponent(host)}&limit=30`);
        if (!rows.length) return log("还没有流水。", "dim");
        rows.forEach((e) => log(
          `${e.ts}  ${e.host}${e.deployment ? "/" + e.deployment : ""}  ${e.kind}  ` +
          `${e.ok ? "成功" : "失败"}  ${e.detail || ""}`, e.ok ? "" : "bad"));
      } catch (e) { fail(e); }
    };
    $("b_backup").onclick = () => { clearLog(); job(url("/backup"), {},
      (r) => log("归档 " + r.archive, "ok")); };
    $("b_logs").onclick = async () => {
      clearLog(); log("读取日志…", "dim");
      try { const r = await api(url("/logs", { tail: 200 })); clearLog(); log(r.text); }
      catch (e) { fail(e); }
    };
  } catch (e) {
    $("view").innerHTML = `<div class="card bad">${esc(e.message)}</div>`;
  }
}

/* —— 部署 —— */
function viewDeploy() {
  const sp = host().spec;
  $("view").innerHTML = `
    <div class="card">
      <h2>部署参数</h2>
      <div class="grid">
        <div><label>部署目录</label><input id="d_dir" value="${esc(sp.dir || "")}"></div>
        <div><label>镜像</label><input id="d_img" value="${esc(sp.image || "")}"></div>
        <div><label>宿主机端口</label><input id="d_port" value="${esc(sp.port ?? "")}"></div>
        <div><label>监听地址</label><input id="d_bind" value="${esc(sp.bind_ip || "")}"></div>
        <div><label>/dev/shm（整容器共享）</label><input id="d_shm" value="${esc(sp.shm_size || "")}"></div>
        <div><label>容器名</label><input id="d_cn" value="${esc(sp.container_name || "")}"></div>
      </div>
      <label style="margin-top:10px"><input type="checkbox" id="d_exp" style="width:auto"
        ${sp.expose ? "checked" : ""}> 监听非回环地址（token 在 HTTP 上是明文，需有防火墙/VPN/TLS）</label>
      <div class="row">
        <button class="go" id="d_pre">体检 + 预览</button>
        <button class="go" id="d_go">部署</button>
      </div>
      <div class="note">部署是幂等的：配置没变就不重建容器、不换 AUTH_TOKEN、不动 data/。</div>
    </div>
    <div id="pre"></div>`;
  const spec = () => ({
    dir: $("d_dir").value.trim(), image: $("d_img").value.trim(),
    port: Number($("d_port").value) || null, bind_ip: $("d_bind").value.trim(),
    shm_size: $("d_shm").value.trim(), container_name: $("d_cn").value.trim(),
    expose: $("d_exp").checked,
  });
  $("d_pre").onclick = async () => {
    $("pre").innerHTML = `<div class="card dim">体检中…</div>`;
    try {
      const p = await api(url("/preflight"), { method: "POST", body: { spec: spec() } });
      const mark = { ok: ["✓", "ok"], warn: ["!", "warn"], fail: ["✗", "bad"] };
      $("pre").innerHTML = `
        <div class="card">
          <h2>体检</h2>
          ${p.checks.map((c) => { const [m, k] = mark[c.level]; return `<div class="chk">
            <span class="${k}">${m}</span> <b>${esc(c.name)}</b> ${esc(c.detail)}
            ${c.hint ? `<div class="note">→ ${esc(c.hint)}</div>` : ""}</div>`; }).join("")}
          ${p.warnings.length ? `<h2 style="margin-top:12px">提醒</h2>` +
            p.warnings.map((w) => `<div class="chk warn">! ${esc(w)}</div>`).join("") : ""}
          <h2 style="margin-top:12px">变更</h2>
          ${p.changes.length ? p.changes.map((c) => `<div class="chk">· ${esc(c)}</div>`).join("")
            : `<div class="chk dim">无 —— 目标机已经是这个状态</div>`}
          ${p.commands.length ? `<h2 style="margin-top:12px">将执行</h2>` +
            p.commands.map((c) => `<div class="chk"><code>${esc(c.join(" "))}</code></div>`).join("") : ""}
          <details style="margin-top:12px"><summary class="dim" style="cursor:pointer">
            将写入的文件</summary>
          ${Object.entries(p.files).map(([f, t]) =>
            `<h2 style="margin-top:10px">${esc(f)}</h2><div class="scroll"><pre>${esc(t)}</pre></div>`).join("")}
          </details>
        </div>`;
    } catch (e) { $("pre").innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
  };
  $("d_go").onclick = () => {
    clearLog(); log("开始部署，拉镜像可能要几分钟…", "dim");
    job(url("/deploy"), { spec: spec() }, (r) => {
      log(r.summary, "ok");
      log(`地址 ${r.url}   token 前缀 ${r.token_hint}（完整值在目标机 ${r.env_path}，权限 600）`);
      log(`取回完整 token：sleight token --host ${CUR}`, "dim");
      viewOverview(); TAB = "overview"; render();
    });
  };
}

/* —— profile —— */
async function viewProfiles() {
  $("view").innerHTML = `<div class="card dim">读取 profile…（远程会临时开一条 SSH 隧道）</div>`;
  try {
    const ps = await api(url("/profiles"));
    $("view").innerHTML = `
      <div class="card">
        <div class="scroll"><table>
          <tr><th>id</th><th>名字</th><th>状态</th><th>tags</th><th>扩展</th><th></th></tr>
          ${ps.map((p) => `<tr>
            <td>${esc(String(p.id).slice(0, 8))}</td>
            <td>${esc(p.name || "")}</td>
            <td class="${p.status === "running" ? "ok" : "dim"}">${esc(p.status || "")}</td>
            <td>${esc((p.tags || []).map((t) => t.tag).join(",") || "—")}</td>
            <td>${(p.extension_paths || []).length}</td>
            <td><button class="mini" data-a="launch" data-p="${esc(p.id)}">启动</button>
                <button class="mini" data-a="stop" data-p="${esc(p.id)}">停止</button></td>
          </tr>`).join("") || `<tr><td colspan="6" class="dim">还没有 profile</td></tr>`}
        </table></div>
        <div class="row">
          <button class="mini" id="p_stopall">全部停止</button>
          <button class="mini" id="p_reload">刷新</button>
        </div>
        <div class="note">停实例不会丢登录态 —— 那些在 /data/profiles/&lt;id&gt;/ 里。
          真正会丢的是删 profile。</div>
      </div>`;
    $("p_reload").onclick = viewProfiles;
    $("view").querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => {
      clearLog();
      try {
        await api(url(`/profiles/${b.dataset.p}/${b.dataset.a}`), { method: "POST" });
        log("完成", "ok"); viewProfiles();
      } catch (e) { fail(e); }
    });
    $("p_stopall").onclick = async () => {
      clearLog();
      try {
        const r = await api(url("/profiles/-/stop-all"), { method: "POST" });
        log(`停了 ${r.stopped.length} 个`, "ok"); viewProfiles();
      } catch (e) { fail(e); }
    };
  } catch (e) { $("view").innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}

/* —— 插件 —— */
async function viewExt() {
  $("view").innerHTML = `<div class="card dim">读取插件…</div>`;
  try {
    const exts = await api(url("/extensions"));
    $("view").innerHTML = `
      <div class="card">
        <h2>目标机上装了什么</h2>
        <div class="scroll"><table>
          <tr><th>目录</th><th>名字</th><th>版本</th><th>manifest</th><th>文件</th><th>容器内路径</th></tr>
          ${exts.map((e) => `<tr>
            <td>${esc(e.dirname)}</td><td>${esc(e.name || "?")}</td><td>${esc(e.version || "?")}</td>
            <td class="${e.manifest_version >= 3 ? "ok" : "bad"}">MV${e.manifest_version || "?"}</td>
            <td>${e.files}</td><td>${esc(e.container_path)}</td></tr>`).join("")
            || `<tr><td colspan="6" class="dim">还没有插件</td></tr>`}
        </table></div>
      </div>
      <div class="card">
        <h2>推一个上去</h2>
        <label>控制机上的本地目录（里面要有 manifest.json）</label>
        <input id="x_path" placeholder="/home/me/repo/plugins/bypass-paywalls-chrome-clean-master">
        <label>目标机上的目录名（留空 = 同名）</label><input id="x_as">
        <div class="row"><button class="go" id="x_push">推送</button></div>
        <div class="note">推送会校验 MV3（Chromium 146 已不支持 MV2）、修好权限
          （容器里的浏览器不是 root），并确认容器真能读到。</div>
      </div>
      <div class="card">
        <h2>下发与验证</h2>
        <div class="row">
          <button class="go" id="x_apply">下发到全部 profile</button>
          <button class="mini" id="x_verify">验证真的加载了</button>
          <button class="mini" id="x_drift">查漂移</button>
        </div>
        <div class="note">下发会重算每个 profile 的两个 Chromium 参数（保留其它 launch_args）
          并停掉在跑的实例 —— 参数只在浏览器启动时读。不用手动拉起，下次 lease() 会带新参数启动。</div>
      </div>
      <div id="x_out"></div>`;
    $("x_push").onclick = () => { clearLog();
      job(url("/extensions/push"),
          { path: $("x_path").value.trim(), as: $("x_as").value.trim() || null },
          () => viewExt()); };
    $("x_apply").onclick = () => { clearLog();
      job(url("/extensions/apply"), { restart: true }, (rows) => {
        const n = rows.filter((r) => r.updated).length;
        log(`${n}/${rows.length} 个 profile 有改动`, n ? "ok" : "dim");
        rows.forEach((r) => log("  " + r.summary));
      }); };
    $("x_verify").onclick = () => { clearLog();
      job(url("/extensions/verify"), { launch: true }, (rows) =>
        rows.forEach((r) => log(r.summary, r.ok ? "ok" : "bad"))); };
    $("x_drift").onclick = async () => {
      $("x_out").innerHTML = `<div class="card dim">比对中…</div>`;
      try {
        const d = await api(url("/extensions/drift"));
        $("x_out").innerHTML = `<div class="card">
          <h2>漂移</h2>
          <div class="scroll"><table>
            <tr><th>profile</th><th>状态</th><th>已配</th><th>缺</th><th>多余</th></tr>
            ${d.profiles.map((p) => `<tr><td>${esc(p.name || p.id)}</td><td>${esc(p.status)}</td>
              <td>${p.configured.length}</td>
              <td class="${p.missing.length ? "bad" : "dim"}">${esc(p.missing.map((m) =>
                m.split("/").pop()).join(", ") || "—")}</td>
              <td class="${p.unknown.length ? "warn" : "dim"}">${esc(p.unknown.map((u) =>
                u.split("/").pop()).join(", ") || "—")}</td></tr>`).join("")}
          </table></div>
          <div class="note ${d.consistent ? "ok" : "bad"}">${d.consistent
            ? "一致：每个 profile 都配了目标机上装的全部插件。"
            : "不一致。lease() 随机租实例，漏掉的那台会造成概率性失败（症状就是「有时候能过付费墙，有时候不能」）。点上面的「下发到全部 profile」修。"}</div>
        </div>`;
      } catch (e) { $("x_out").innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
    };
  } catch (e) { $("view").innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}

/* ---------- 启动 ---------- */
(async () => {
  const url = new URLSearchParams(location.search);
  const saved = url.get("token") || localStorage.getItem("sleight_ui_token") || "";
  $("tok").value = saved;
  $("tok").onchange = () => { localStorage.setItem("sleight_ui_token", token()); loadHosts(); };
  try {
    DEFAULTS = await api("/api/defaults");
    $("ver").textContent = "v" + DEFAULTS.version;
    $("tokwrap").hidden = !DEFAULTS.auth;
    if (saved) localStorage.setItem("sleight_ui_token", saved);
    $("h_dir").placeholder = DEFAULTS.spec.dir;
    await loadHosts();
    render();
  } catch (e) {
    document.body.insertAdjacentHTML("afterbegin",
      `<div class="card bad" style="margin:14px">${esc(e.message)}
       —— 口令不对的话在右上角填一下。</div>`);
    $("tokwrap").hidden = false;
  }
})();
</script>
</body>
</html>
