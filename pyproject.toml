[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleight"
version = "0.4.0"
description = "Drive any CDP browser like a human — trajectories, typing rhythm, instance leasing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sleight contributors" }]
keywords = ["cdp", "chrome-devtools-protocol", "browser", "automation", "human-like", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["websocket-client>=1.9"]

[project.optional-dependencies]
redis = ["redis>=5"]
# 部署功能的引擎和 CLI 只用标准库；这个 extra 只是 sleight ui 那个 Web 界面要的。
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
# redis / fakeredis 进 dev：不装的话 tests/test_lease_redis.py 连 import 都过不去。
# fakeredis[lua] 带真 Lua 解释器，CAS 脚本因此在 CI 里是被真正执行的，不是走替身。
# httpx 是 fastapi 的 TestClient 要的，只在测试里用。
# **不要换成 httpx2**：starlette 1.4 弃用了 httpx 那条路（跑测试会看到一条
# StarletteDeprecationWarning），但 fastapi 的 TestClient 至今仍 import httpx ——
# 换过去的后果是 test_deploy_api.py 整个 36 条**静默跳过**，构建照样是绿的。
dev = [
    "pytest>=8",
    # 下界钉在 0.16：更早的版本规则集不同，本地绿、CI 红，这个我们真踩过
    "ruff>=0.16",
    "redis>=5",
    "fakeredis[lua]>=2.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
# 部署与运维入口。sleight --help 列全部子命令
sleight = "sleight.cli:main"

[project.urls]
Homepage = "https://github.com/yuanqimanong/sleight"
Repository = "https://github.com/yuanqimanong/sleight"
Issues = "https://github.com/yuanqimanong/sleight/issues"
Documentation = "https://github.com/yuanqimanong/sleight/blob/main/docs/%E8%AF%A6%E7%BB%86%E6%96%87%E6%A1%A3%E6%89%8B%E5%86%8C.md"

[tool.hatch.build.targets.wheel]
packages = ["sleight"]
# 没有它 mypy 会把 sleight 当成无类型包，全量 type hints 对使用者等于不存在
artifacts = ["sleight/py.typed"]

[tool.hatch.build.targets.sdist]
# 显式白名单。默认会把 .idea/ 和 .claude/settings.local.json 一并打进去，
# 里面带着开发机的绝对路径。
include = ["sleight", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3: 注释和文档字符串是中文的，全角标点是有意为之
# A001/A002: errors.py 有意遮蔽 ConnectionError / TimeoutError，给包内统一入口
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# B008: `= Body(...)` / `= Query(...)` 就是 FastAPI 声明请求参数的方式，
# 把它挪进函数体等于放弃框架的校验和自动文档
"sleight/deploy/api/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real browser on --remote-debugging-port",
    "manager: needs a real CloakBrowser Manager",
    "redis: needs a real Redis at $SLEIGHT_TEST_REDIS_URL",
    "deploy: needs a real docker daemon (and for --ssh, a reachable host)",
]
