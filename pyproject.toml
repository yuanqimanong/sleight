[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleight"
version = "0.6.0"
description = "Drive any CDP browser like a human — trajectories, typing rhythm, instance leasing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sleight contributors" }]
keywords = ["cdp", "chrome-devtools-protocol", "browser", "automation", "human-like", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "websocket-client>=1.9",
    "lxml>=6.1.3",
    "fastapi>=0.142.4",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "websockets>=17.2",
    "PyYAML>=6.0.3",
    "psutil>=7.2.2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=46",
    "mcp>=1.26,<2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # 下界钉在 0.16：更早的版本规则集不同，本地绿、CI 红，这个我们真踩过
    "ruff>=0.16",
]

[project.scripts]
# 部署与运维入口。sleight --help 列全部子命令
sleight = "sleight.cli:main"
# MCP server（stdio）。MCP host 里配一条命令即可，见 sleight/agent/mcp.py
sleight-mcp = "sleight.agent.mcp:main"

[project.urls]
Homepage = "https://github.com/yuanqimanong/sleight"
Repository = "https://github.com/yuanqimanong/sleight"
Issues = "https://github.com/yuanqimanong/sleight/issues"
Documentation = "https://github.com/yuanqimanong/sleight/wiki"

[tool.hatch.build.targets.wheel]
packages = ["sleight"]
# 没有它 mypy 会把 sleight 当成无类型包，全量 type hints 对使用者等于不存在
artifacts = ["sleight/py.typed", "sleight/deploy/api/static/**"]

[tool.hatch.build.targets.sdist]
# 显式白名单。默认会把 .idea/ 和 .claude/settings.local.json 一并打进去，
# 里面带着开发机的绝对路径。
include = ["/sleight", "/tests", "/docs", "/frontend/src", "/frontend/tests", "/frontend/package.json", "/frontend/package-lock.json", "/frontend/vite.config.ts", "/frontend/tsconfig.json", "/frontend/index.html", "/.env.example", "/README.md", "/README-zh.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/.uv-cache/**", "**/.pytest_cache/**", "**/.ruff_cache/**", "**/node_modules/**", "**/__pycache__/**"]
artifacts = ["sleight/deploy/api/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3: 注释和文档字符串是中文的，全角标点是有意为之
# A001/A002: errors.py 有意遮蔽 ConnectionError / TimeoutError，给包内统一入口
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# B008: `= Body(...)` / `= Query(...)` 就是 FastAPI 声明请求参数的方式，
# 把它挪进函数体等于放弃框架的校验和自动文档
"sleight/deploy/api/*.py" = ["B008"]
"sleight/service/api.py" = ["B008"]
"sleight/service/console_api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real browser on --remote-debugging-port",
    "manager: needs a real CloakBrowser Manager",
    "deploy: needs a real docker daemon (and for --ssh, a reachable host)",
]
